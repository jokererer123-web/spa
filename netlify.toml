[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Runs the Next.js App Router (SSR, route handlers, image optimisation) on
# Netlify Functions. Installed automatically for Next projects, pinned here so
# CI builds are reproducible.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Deploy previews for every pull request against the working branch.
[context.production.environment]
  NODE_ENV = "production"

[context.deploy-preview]
  command = "npm run build"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The scroll-sequence frames are content-hashed build assets.
[[headers]]
  for = "/hero/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
